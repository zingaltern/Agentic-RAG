# CI 基线门禁（4.5）：PR/推送跑单测（覆盖率门禁 >=80%）+ 前端构建 + 可选评测对比
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 单测 + 覆盖率门禁（fail_under=80）
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 失败用例以 annotation 形式挂到 Job 上：无需下载/权限即可定位失败项
            grep -E "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r line; do
              echo "::error title=pytest-failure::${line}"
            done
            echo "::error title=pytest-exit::make test 退出码 ${status}（明细见 pytest-failure 注解）"
          fi
          exit "$status"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

  eval:
    runs-on: ubuntu-latest
    continue-on-error: true   # 评测对比失败留痕，不阻断 PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖 + 评测（进程内，首次下载嵌入/重排模型）
        run: |
          pip install -e ".[dev]"
          HF_ENDPOINT=https://hf-mirror.com make eval
      - name: 上传评测报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
