# 系统配置（DEVELOPMENT.md 第 4 章 + 13.8）
# 优先级：内置默认 < 本文件 < RAG_ 前缀环境变量
env: dev

api:
  host: 127.0.0.1                 # S2（13.11.1）：默认仅本机；0.0.0.0 需显式配置暴露
  port: 8000
  auth_enabled: true
  query_rate_per_min: 20              # C4（V5.1）：/api/query 每 IP 每分钟上限
  upload_rate_per_min: 10           # C4：/api/documents/upload 每 IP 每分钟上限
  cors_origins: ["http://localhost:5173"]   # 13.8：dev 模式 vite proxy 之外的跨域白名单

frontend:                          # 13.8：SPA 前端工程
  dev_port: 5173
  dist_dir: ./frontend/dist

embedding:
  provider: local_bge_v15          # local_bge_v15（MVP）| bge_m3 | remote_api
  model_name: BAAI/bge-small-zh-v1.5
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  device: auto                     # auto|cpu|mps
  batch_size: 64
  dimension: 0                     # 0 = 由模型自动识别（运行时回填实际维度）

chunker:                           # 父子分块（DEVELOPMENT.md 5.2）
  parent_target_tokens: 512
  child_target_tokens: 128
  token_char_ratio: 1.8            # 仅 ratio 口径/回退使用（中文约 1.0 字符/token）
  measure: auto                    # V5.2：auto=优先引擎 count_tokens（精确）；ratio=强制估算
  table_aware:                     # P1-4：表格原子块（整表/行组携带完整表头；新入库生效）
    enabled: true
    max_rows_per_chunk: 30         # 超限大表按行组切，每组行数上限（强制带表头）
    json_max_bytes: 4096           # table_json 字节上限（超限截断+warning）
  hard_boundary:                   # P1-5：标题硬边界（默认关；section 变更即断块）
    enabled: false
  context_prefix:                  # P1-5：上下文前缀（默认关；不计切块 token、计 embedding）
    enabled: false
    include_page: false
    template: "{doc_title} > {section}"
    include_page: false            # 前缀附加页码（需 page_spans 可解析）

vector_store:
  provider: chroma
  persist_dir: ./data/chroma
  collection: kb

retriever:
  provider: hybrid_rrf
  top_k: 20
  candidates: 50
  rr_fused_k: 60

reranker:
  provider: bge_reranker           # identity(回退) | bge_reranker(W5)
  model_name: BAAI/bge-reranker-base   # v2-m3 在 CPU 上单轮重排 ~3-8s 易触发 30s 预算；base 快一个量级（13.2 允许按硬件切换）
  rerank_top_k: 5
  batch_size: 32
  device: auto

evaluator:
  provider: semantic_v2            # rule(回退) | semantic_v2(W5)
  rule_threshold: 0.45
  semantic_v2_threshold: 0.45
  top_n: 5

rewriter:
  provider: llm                    # rule(回退) | llm(W5)
  synonyms_csv: ./configs/synonyms.csv
  llm_timeout_seconds: 30
  step_back_enabled: false         # 08-Q1：Step-Back 抽象化变体（合并单次 LLM 调用，默认关）
  hyde_enabled: false              # 08-Q1：HyDE 假设文档变体（vector 路径，默认关）

detector:
  provider: semantic               # citation(回退) | semantic(W5)
  similarity_threshold: 0.8
  semantic_similarity_threshold: 0.6

llm:
  provider: deepseek
  candidates: []              # A6：多模型候选（按优先级），空=单模型
  circuit_fail_threshold: 3
  circuit_cooldown_seconds: 60
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.1
  max_tokens: 1024
  timeout_seconds: 30
  tool_calling: auto               # P-D：auto | native | json | off
  tool_call_timeout_seconds: 30
  max_tool_calls_per_turn: 4
  # api_key 只允许通过环境变量注入（RAG_DEEPSEEK_API_KEY / RAG_LLM_API_KEY），禁止写入本文件

orchestration:
  mode: reflect                    # P-D：reflect | agentic | auto（默认 reflect，零回归）
  max_reflection_iterations: 3
  search_timeout_seconds: 10
  request_timeout_seconds: 30
  max_concurrent_queries: 4        # C3（V5.1）：并发查询上限，耗尽返回 43001
  semaphore_acquire_timeout_seconds: 5.0
  agent:                           # P-D：真 Agentic（默认关，见 DEVELOPMENT.md 第 17 章）
    enabled: false
    max_steps: 8
    max_llm_calls: 8
    max_tool_calls: 12
    max_parallel_tools: 3
    max_replans: 2
    max_parse_failures: 2
    max_concurrent_queries: 2
    acquire_timeout_seconds: 0.5
    request_timeout_seconds: 45
    max_context_tokens: 6000
    max_evidence_items: 24
    max_evidence_chars: 4000
    min_evidence_score: 0.25
    routing:
      enabled: true
      agentic_threshold: 3
      reflect_threshold: 1
      escalate_on_reflect_failure: true
      max_escalations: 1
      escalate_min_budget_ratio: 0.5
    planning:
      enabled: true
      max_subgoals: 4
      temperature: 0.1
    reflection:
      llm_judge: false
      max_llm_judgements: 2
      min_evidence_per_subgoal: 1
    synthesis:
      citation_repair: true
      max_repair_attempts: 1
      strict_verify: false
    fallback:
      on_plan_error: reflect
      on_tool_error: reflect
      on_protocol_error: reflect
    tools:
      kb_search: {enabled: true, default_k: 8, max_k: 20}
      kb_fetch: {enabled: true, max_chars: 4000}
      kb_list_documents: {enabled: true, max_items: 50}
      kb_outline: {enabled: false, max_sections: 40}
      web_search: {enabled: false, max_results: 5, allowed_domains: []}  # enabled=true 时必须显式配置；空列表启动失败
      ask_user: {enabled: true}

ingestion:
  max_file_size_mb: 50
  allowed_extensions: [pdf, docx, xlsx, pptx, doc, xls, ppt, md, txt, html, htm, eml, msg,
                       json, jsonl, csv, tsv,
                       py, js, mjs, cjs, ts, tsx, jsx, java, go, rs, c, h, cpp, hpp, cs,
                       rb, php, kt, swift, sh, sql, vue, css, scss, yaml, yml, toml, ini, xml]
  embed_batch_size: 64
  max_queue_size: 64              # C5（V5.1）：入库队列上限，满时返回 43003
  zip_max_total_mb: 200           # S2（V5.1）：zip 解压总大小上限（防炸弹）
  zip_max_entries: 1000           # S2：zip 条目数上限
  max_pages: 2000                 # V5.2：单文档解析页数上限（PDF 超限截断 + 打标）
  tabular_max_rows: 200000        # V5.2：表格类（xlsx/xls/csv/tsv）行数上限（超限截断 + 打标）
  empty_result: reject            # V5.2：0 块拒收（30007）| allow=旧行为（success + 0 块）
  quality_gate:                   # P0-1：解析质量门禁（默认关，不改变现有入库行为）
    enabled: false
    mode: reject                  # reject=拒收（Job failed 30005）；flag=仅打标 metadata 继续入库
    min_text_chars: 30            # 有效文本最小字符数（不足判 empty_text）
    max_garbled_ratio: 0.05       # U+FFFD 乱码占比上限（超过判 high_garbled）
    min_pages_with_text_ratio: 0.2  # 多页 PDF 有文本页占比下限（低于判 few_pages_with_text）
  archive:                        # P0-2：原件归档（默认关；换 embedding 重建/重解析/审计取证的前置）
    enabled: false
    dir: ./data/archive
  pii:                            # P2-6：PII 全局策略（默认关；库级 KbInfo.pii 可覆盖）
    enabled: false
    mode: mask                     # mask=*** | replace=[身份证] 占位符 | delete=移除
    types: [id_card, phone, bank_card]
  parser_routing: {}              # P3-8：解析链路由（空=旧单实现路径；例 {"pdf": {"chain": ["pymupdf"]}}）
  json_flatten:                   # 16.3：JSON/JSONL 路径扁平化上限（防超深/超大结构）
    max_items: 5000               # 单文档最多产出行数（超出截断 + 尾部标记）
    max_depth: 12                 # 最大递归深度（超出写 <max-depth> 占位）
  office_convert:                 # 16.2：.doc/.ppt 经 LibreOffice 转换后复用 docx/pptx 解析
    enabled: true                 # false=直接拒绝（30003），不尝试外部命令
    soffice_path: ""              # 空=自动探测 PATH 上的 soffice/libreoffice
    timeout_seconds: 60           # 单次转换超时；超时/失败 → ParseError 30003
  code_symbols:                   # 16.5：代码 AST 符号提取（tree-sitter；缺 grammar 自动回退纯文本）
    enabled: true                 # false=代码退化为纯文本解码
    index_in_text: true           # 正文前置 [CODE_INDEX] 符号索引块
    max_symbols: 500              # 单文件符号数上限

cleaner:
  enabled: false                  # 数据清洗层开关（解析后、分块前），默认关不改变现有行为
  normalize: true                 # 宽度归一（全角字母数字/表意空格/控制字符）
  normalize_punct: false          # V5.2：中文标点→半角 ASCII（。→. 等；默认关）
  noise: true
  dedup: true
  quality: true
  dedup_threshold: 0.9
  min_chunk_chars: 20
  paragraph_mode: auto            # V5.2：auto=空行优先/无空行按行 | blank | line
  max_drop_ratio: 0.5             # V5.2：质量过滤删除占比超限则整体跳过
  dedup_max_paragraphs: 5000      # V5.2：段落数超限跳过 dedup（防 O(n²)）
  # exempt_kinds：代码/结构化类文档豁免 quality/dedup（内置默认表，见 config.py）

injection:                        # P-C：入库侧提示注入扫描（默认关，不改变现有入库行为）
  enabled: false
  mode: audit                     # audit=命中仅审计日志+metadata 标记；reject=拒收（Job failed 40002）
  patterns: []                    # 追加模式：内置模式表始终生效，此处追加自定义正则
  whitelist: []                   # 误杀白名单子串

moderation:                       # P-C：入库前内容审核层（默认关）
  enabled: false
  mode: reject                    # reject=拒收（40003）；flag=仅标记 metadata
  keywords_csv: ./configs/moderation_keywords.csv

memory:                          # A1：会话记忆压缩
  enabled: true
  compress_threshold: 6

web:                              # A5：联网检索（Tavily，key 走环境变量）
  enabled: false
  provider: tavily
  api_key_env: RAG_TAVILY_API_KEY
  max_results: 5
  search_depth: basic
  timeout_seconds: 8
  first_round_only: true

# —— 13.12 输入侧治理（在线侧输入处理落地；全部默认关，clarification 默认开）——
query_input:                      # L1 输入标准化管线（默认关：仅全角/空白归一）
  enabled: false
  filter_invalid_chars: true      # Emoji/控制字符清理 + 连续重复标点压缩
  asr_smooth: true                # 语音转写语气词清理 + 连续单字重复压缩
  asr_filler_words: ["嗯", "那个", "就是说", "然后", "呃", "额", "这个这个", "就是"]
  resolve_relative_time: true     # 相对时间 → 绝对时间（"昨天"→"2026-08-17"）
  time_reference_date: null       # 如 "2026-08-17"；null=取当天
  timezone: Asia/Shanghai

query_security:                   # 查询侧安全前置（复用入库侧注入扫描+内容审核）
  enabled: false
  mode: audit                     # audit=命中仅审计日志；reject=拦截（40002/40003）
  injection: true
  moderation: true
  patterns: []                    # 追加注入模式（内置表始终生效）
  whitelist: []                   # 误杀白名单子串
  keywords_csv: ./configs/moderation_keywords.csv

greeting:                         # L0 极简通道：问候/闲聊/能力边界直达（13.13 T2，部署启用）
  enabled: true
  rules:                          # 每条规则独立回复；单个正则非法自动跳过（不中断主链路）
    - name: greet
      pattern: "^(?:你好|您好|嗨|哈喽|hello|hi|hey)\\s*[!！。~～]*$"
      reply: "您好，我是企业知识库问答助手，可以问我知识库相关的问题，例如「年假怎么申请？」"
    - name: presence
      pattern: "^(?:在吗|在么|有人吗)\\s*[?？]*$"
      reply: "在的，请问想查询知识库里的什么内容？"
    - name: thanks
      pattern: "^(?:谢谢|感谢|谢啦|多谢)\\s*[!！。~～]*$"
      reply: "不客气，如还有其他问题随时问我。"
    - name: identity
      pattern: "^(?:你是谁|你叫什么名字|你是什么|介绍一下你自己|你能做什么|你有什么功能)"
      reply: "我是企业知识库问答助手：基于已上传到本机的文档回答问题并标注引用来源，知识库没有的内容我会如实告知。"
    - name: is_bot
      pattern: "^(?:你是机器人吗|是真人吗|是AI吗|是ai吗|是人工智能吗)"
      reply: "我是 AI 问答助手，基于本机知识库回答问题，不是真人。"
    - name: realtime_weather
      pattern: "^(?:今天|现在|当前)?(?:天气怎么样?|天气如何|气温多少)"
      reply: "抱歉，天气等实时信息不在知识库问答范围内，请问我知识库相关的问题。"
    - name: realtime_time
      pattern: "^(?:现在几点(?:了)?|今天几号|今天多少号|今天是什么日期)"
      reply: "抱歉，实时日期时间不在知识库问答范围内。"

clarification:                    # A2 反问模板化（默认开：固定模板+槽位，LLM 仅可选增强）
  enabled: true
  max_rounds: 2                   # 每会话连续反问上限（dialogue 启用后计数）
  use_llm: false
  templates:
    no_entity: "请问您具体想了解哪个方面的内容呢？"
    missing_issue: "请问您遇到了什么具体问题？"
    generic: "您的需求我暂时没有理解清楚，建议您描述更详细一些，或联系人工客服。"
  fallback_message: "您的需求我暂时没有理解清楚，建议您描述更详细一些，或联系人工客服。"

dialogue:                         # L2 服务端会话（13.13 T3：部署启用，前端已携带 session_id）
  enabled: true
  session:
    ttl_seconds: 1800             # 会话空闲过期（30 分钟）
    max_rounds: 5                 # 保留最近 N 轮
    enable_rollback: true
    rollback_keywords: ["不对", "说错了", "不是这个", "重来", "不是"]
  boundary:
    enabled: true
    semantic_threshold: 0.60      # 余弦 < 阈值 → 提示新话题
    entity_jaccard_threshold: 0.20
    use_embedding: true
  max_sessions: 100               # 内存会话上限（LRU 淘汰）

logging:
  level: info
  json: true

documents:
  persist_file: ./data/documents.json

kbs:
  persist_file: ./data/kb.json

index_dna:                        # P1-3：索引 DNA 查询侧校验（默认关；换 embedding/分块/清洗配置后提示重建）
  enabled: false
  mode: audit                     # audit=warning+响应标记；reject=拦截（30006）
