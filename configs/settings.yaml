# 系统配置（DEVELOPMENT.md 第 4 章 + 13.8）
# 优先级：内置默认 < 本文件 < RAG_ 前缀环境变量
env: dev

api:
  host: 127.0.0.1                 # S2（13.11.1）：默认仅本机；0.0.0.0 需显式配置暴露
  port: 8000
  auth_enabled: true
  query_rate_per_min: 20              # C4（V5.1）：/api/query 每 IP 每分钟上限
  upload_rate_per_min: 10           # C4：/api/documents/upload 每 IP 每分钟上限
  cors_origins: ["http://localhost:5173"]   # 13.8：dev 模式 vite proxy 之外的跨域白名单

frontend:                          # 13.8：SPA 前端工程
  dev_port: 5173
  dist_dir: ./frontend/dist

embedding:
  provider: local_bge_v15          # local_bge_v15（MVP）| bge_m3 | remote_api
  model_name: BAAI/bge-small-zh-v1.5
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  device: auto                     # auto|cpu|mps
  batch_size: 64
  dimension: 0                     # 0 = 由模型自动识别（运行时回填实际维度）

chunker:                           # 父子分块（DEVELOPMENT.md 5.2）
  parent_target_tokens: 512
  child_target_tokens: 128
  token_char_ratio: 1.8

vector_store:
  provider: chroma
  persist_dir: ./data/chroma
  collection: kb

retriever:
  provider: hybrid_rrf
  top_k: 20
  candidates: 50
  rr_fused_k: 60

reranker:
  provider: bge_reranker           # identity(回退) | bge_reranker(W5)
  model_name: BAAI/bge-reranker-base   # v2-m3 在 CPU 上单轮重排 ~3-8s 易触发 30s 预算；base 快一个量级（13.2 允许按硬件切换）
  rerank_top_k: 5
  batch_size: 32
  device: auto

evaluator:
  provider: semantic_v2            # rule(回退) | semantic_v2(W5)
  rule_threshold: 0.45
  semantic_v2_threshold: 0.45
  top_n: 5

rewriter:
  provider: llm                    # rule(回退) | llm(W5)
  synonyms_csv: ./configs/synonyms.csv
  llm_timeout_seconds: 30

detector:
  provider: semantic               # citation(回退) | semantic(W5)
  similarity_threshold: 0.8
  semantic_similarity_threshold: 0.6

llm:
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.1
  max_tokens: 1024
  timeout_seconds: 30
  # api_key 只允许通过环境变量注入（RAG_DEEPSEEK_API_KEY / RAG_LLM_API_KEY），禁止写入本文件

orchestration:
  max_reflection_iterations: 3
  search_timeout_seconds: 10
  request_timeout_seconds: 30
  max_concurrent_queries: 4        # C3（V5.1）：并发查询上限，耗尽返回 43001
  semaphore_acquire_timeout_seconds: 5.0

ingestion:
  max_file_size_mb: 50
  allowed_extensions: [pdf, docx, xlsx, pptx, md, txt, html, htm, eml, msg]
  embed_batch_size: 64
  max_queue_size: 64              # C5（V5.1）：入库队列上限，满时返回 43003
  zip_max_total_mb: 200           # S2（V5.1）：zip 解压总大小上限（防炸弹）
  zip_max_entries: 1000           # S2：zip 条目数上限

cleaner:
  enabled: false                  # 数据清洗层开关（解析后、分块前），默认关不改变现有行为
  normalize: true
  noise: true
  dedup: true
  quality: true
  dedup_threshold: 0.9
  min_chunk_chars: 20

injection:                        # P-C：入库侧提示注入扫描（默认关，不改变现有入库行为）
  enabled: false
  mode: audit                     # audit=命中仅审计日志+metadata 标记；reject=拒收（Job failed 40002）
  patterns: []                    # 追加模式：内置模式表始终生效，此处追加自定义正则
  whitelist: []                   # 误杀白名单子串

moderation:                       # P-C：入库前内容审核层（默认关）
  enabled: false
  mode: reject                    # reject=拒收（40003）；flag=仅标记 metadata
  keywords_csv: ./configs/moderation_keywords.csv

logging:
  level: info
  json: true

documents:
  persist_file: ./data/documents.json

kbs:
  persist_file: ./data/kb.json
