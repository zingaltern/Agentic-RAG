[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "1.0.0"
description = "Agentic RAG 智能知识库系统（DeepSeek + BGE + Chroma + FastAPI）"
requires-python = ">=3.10,<3.13"
dependencies = [
    # API 框架与配置（DEVELOPMENT.md 1.1 表）
    "fastapi>=0.110",
    "uvicorn[standard]",
    "python-multipart",            # 新增：POST /api/documents/upload 表单解析需要
    "pydantic>=2.6",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0",                     # 新增：configs/settings.yaml 加载（第 4 章配置体系需要，属必要引入）
    # 向量化与向量库
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    # 注：第二阶段（DEVELOPMENT.md 13.2）精排将用 sentence-transformers 的
    # CrossEncoder（BAAI/bge-reranker-v2-m3），已由本依赖覆盖，无需新增包。
    # 若后续切换 FlagEmbedding 或引第三方 SDK，须在此登记并说明理由。
    # 混合检索与中文处理
    "rank-bm25>=0.2",
    "jieba>=0.42",
    # 文档解析
    "pymupdf",
    "python-docx",
    "openpyxl",
    "python-pptx",
    # 新增（DEVELOPMENT.md 16.2）：旧版 Excel .xls 是 OLE2 二进制格式，openpyxl 不支持；
    # xlrd>=2.0 只读 .xls（纯 Python、无编译依赖），为当前唯一成熟选项。
    # .doc/.ppt 不引 Python 依赖，走可选 LibreOffice 外部转换（16.2）。
    "xlrd>=2.0",
    # 新增（DEVELOPMENT.md 16.5）：代码文件 AST 符号提取。
    # tree-sitter 核心 + 15 个语言 grammar（官方发布，均有 macOS/Linux/Windows 预编译 wheel）。
    # 设计为按需 import：缺任一 grammar 只影响该语言（回退纯文本解码），不影响启动；
    # 配置格式（yaml/toml/ini/xml）不接 grammar，走纯文本路径。
    "tree-sitter>=0.22",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-c-sharp",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-bash",
    "tree-sitter-kotlin",
    "tree-sitter-swift",
    "tree-sitter-css",
    # LLM（OpenAI 兼容协议）
    # 上限 3：openai 3.x 改用 httpx2，单测的 respx(httpx 传输层) mock 不再生效、
    # 会真实请求 api.deepseek.com（CI 因此 401）。升级需同步改造 HTTP mock，另立批次。
    "openai>=1.30,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "httpx",           # 新增：FastAPI TestClient 需要（第 7 章 /ui 与 API 契约测试）
    "pytest-cov",      # 新增：覆盖率门禁（W4 验收，行覆盖率 ≥80%）
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli/rageval.py"]   # 评测 CLI 走 HTTP/进程内全链路，不以单测覆盖为目标

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
sort = "cover"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实 Chroma/BGE/LLM 资源的集成测试（W2 起）",
]
addopts = "-q"
